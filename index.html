<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <title>Auric Drift</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <canvas id="game" aria-label="Auric Drift game area"></canvas>

      <section class="hud" aria-live="polite">
        <div>
          <span class="label">score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">chain</span>
          <strong id="chain">x1</strong>
        </div>
        <div>
          <span class="label">stage</span>
          <strong id="stage">1</strong>
        </div>
        <div>
          <span class="label">best</span>
          <strong id="best">0</strong>
        </div>
      </section>

      <section class="mission" aria-live="polite">
        <span id="objective">Steal 12 gold caches</span>
        <strong id="objectiveProgress">0/12</strong>
      </section>

      <section class="vault" aria-hidden="true">
        <span id="vaultBar"></span>
      </section>

      <section class="meter" aria-hidden="true">
        <span id="shieldBar"></span>
      </section>

      <button id="pulseButton" class="pulse-button" type="button">Pulse</button>

      <section id="overlay" class="overlay">
        <div class="brand">AURIC DRIFT</div>
        <p>Heist Run: clear three convoy stages, choose upgrades, then crack the vault core.</p>
        <div id="upgradeChoices" class="upgrade-choices" aria-live="polite"></div>
        <button id="startButton" type="button">Launch</button>
      </section>
    </main>

    <script src="./heist.js"></script>
  </body>
</html>
