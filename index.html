<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <title>Auric Drift</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <canvas id="game" aria-label="Auric Drift game area"></canvas>

      <section class="hud" aria-live="polite">
        <div>
          <span class="label">score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">chain</span>
          <strong id="chain">x1</strong>
        </div>
        <div>
          <span class="label">best</span>
          <strong id="best">0</strong>
        </div>
      </section>

      <section class="meter" aria-hidden="true">
        <span id="shieldBar"></span>
      </section>

      <section id="overlay" class="overlay">
        <div class="brand">AURIC DRIFT</div>
        <p>Drag anywhere to steer. Collect gold, skim gates, and keep your shield alive.</p>
        <button id="startButton" type="button">Launch</button>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
